[project]
name = "voice-agent"
version = "0.1.0"
description = "Minimal real-time voice agent — frame-based, queue-driven pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
    "sounddevice>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
vad = [
    "silero-vad",
    "torch",
]
stt = [
    "deepgram-sdk>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
